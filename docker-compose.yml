version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eventbook-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/eventbook
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=production_super_secret_jwt_key_at_least_32_chars!
      - JWT_EXPIRES_IN=7d
      - STRIPE_SECRET_KEY=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
      - CLOUDINARY_CLOUD_NAME=placeholder
      - CLOUDINARY_API_KEY=placeholder
      - CLOUDINARY_API_SECRET=placeholder
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=placeholder@example.com
      - SMTP_PASS=placeholder
      - EMAIL_FROM=EventBook <noreply@eventbook.com>
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7-jammy
    container_name: eventbook-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
